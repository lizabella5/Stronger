<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1ea">
<title>STRONGER</title>
<style>
:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#252525;--muted:#77716a;--line:#e3ddd4;--accent:#536b5b;--accent2:#d8e1d7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:28px 20px 14px;position:sticky;top:0;background:rgba(245,241,234,.95);backdrop-filter:blur(12px);z-index:3}
h1{margin:0;font-size:30px;letter-spacing:.08em}h2{font-size:20px;margin:8px 0 14px}h3{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:8px;overflow:auto;padding:10px 16px;background:var(--bg);position:sticky;top:75px;z-index:2}
nav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;color:var(--ink)}
nav button.active{background:var(--accent);color:white;border-color:var(--accent)}
main{max-width:720px;margin:auto;padding:8px 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000005}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:14px}.big{font-size:26px;font-weight:700}.muted{color:var(--muted);font-size:13px}
button.primary{width:100%;background:var(--accent);color:white;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:650}
button.secondary{background:var(--accent2);border:0;border-radius:10px;padding:9px 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exercise{padding:14px 0;border-top:1px solid var(--line)}.sets{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;align-items:center}
input,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;background:white;width:100%}
progress{width:100%;height:10px;accent-color:var(--accent)}.photo{border:1px dashed #aaa;border-radius:14px;padding:14px;margin-top:10px}
small{color:var(--muted)}.pill{display:inline-block;background:var(--accent2);padding:5px 9px;border-radius:999px;font-size:12px}
footer{color:var(--muted);text-align:center;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><h1>STRONGER</h1><div class="muted">build capability • track evidence • keep going</div></header>
<nav id="nav"></nav><main id="app"></main>
<footer>Your data stays in this browser. Export it regularly.</footer>
<script>
const KEY="stronger_v1";
const plan={
"Gym A — Lower":["Incline walk","Leg press","Leg extension","Calf raises","Goblet squat","Glute bridges","Dead bugs"],
"Gym B — Upper + Core":["Incline walk","Lat pulldown","Lateral raise","Triceps pushdown","Glute bridges","Bird dogs","Side plank"],
"Gym C — Full Body":["Incline walk","Leg press","Lat pulldown","Leg extension","Calf raises","Glute bridges","Core"],
"Gym D — Lower + Core + Incline":["Leg press","Romanian deadlift","Goblet squat","Hamstring curl","Hip abductor","Dead bugs","Bird dogs","Pallof press","Glute bridge march","Plank","Incline treadmill"],
"Jog 1":["Run/walk intervals"],"Jog 2":["Run/walk intervals"]
};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
aim:"Build a strong, lean, capable body and become a person who runs.",
challenge:"Complete 5 km using the run/walk pattern I build.",
sessions:[],photos:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function weekStart(){let d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d}
function weekly(type){return data.sessions.filter(x=>x.type===type&&new Date(x.date)>=weekStart()).length}
function nav(active){document.getElementById("nav").innerHTML=["Today","Progress","Challenge","Photos"].map(x=>`<button class="${active===x?"active":""}" onclick="render('${x}')">${x}</button>`).join("")}
function render(page="Today"){nav(page);({Today:today,Progress:progress,Challenge:challenge,Photos:photos}[page])(document.getElementById("app"))}
const metric=(a,b)=>`<div class="metric"><div class="muted">${a}</div><div class="big">${b}</div></div>`;
function today(a){
let strength=weekly("Gym A — Lower")+weekly("Gym B — Upper + Core")+weekly("Gym C — Full Body")+weekly("Gym D — Lower + Core + Incline");
let jog=weekly("Jog 1")+weekly("Jog 2");
a.innerHTML=`<section class="card"><h2>Your aim</h2><p>${esc(data.aim)}</p><span class="pill">12-week challenge</span><p><b>${esc(data.challenge)}</b></p></section>
<section class="card"><h2>This week</h2><div class="grid">${metric("Strength",strength+"/3")}${metric("Jogging",jog+"/2")}${metric("Mobility",weekly("Mobility")+"/4")}${metric("Movement",weekly("Movement")+"/7")}</div></section>
<section class="card"><h2>Start a session</h2><div class="grid">${Object.keys(plan).map(x=>`<button class="secondary" onclick="start('${x}')">${x}</button>`).join("")}</div></section>
<section class="card"><h2>Quick recovery</h2><div class="grid"><button class="secondary" onclick="quick('Mobility')">🧘 Mobility</button><button class="secondary" onclick="quick('Movement')">🚶 Movement</button><button class="secondary" onclick="render('Photos')">📸 Weekly photo</button><button class="secondary" onclick="quick('Rest')">😴 Rest day</button></div></section>`;
}
function quick(type){data.sessions.push({date:new Date().toISOString(),type,inputs:{},note:""});save();render("Today")}
function start(type){
document.getElementById("app").innerHTML=`<section class="card"><div class="row"><div><h2>${type}</h2><small>Log what you actually do. You can stop early.</small></div><button class="secondary" onclick="render('Today')">Exit</button></div>
${plan[type].map((e,i)=>e==="Run/walk intervals"?`<div class="exercise"><h3>${e}</h3><div class="grid"><label>Run sec<input id="run" type="number" value="30"></label><label>Walk sec<input id="walk" type="number" value="90"></label><label>Rounds<input id="rounds" type="number" value="6"></label><label>Completed<input id="done" type="number" value="0"></label></div></div>`:e==="Incline treadmill"?`<div class="exercise"><h3>${e}</h3><small>15 min finish: 3 min at 4–5% • 4 min at 7% • 4 min at 9–10% • 2 min at 6% • 2 min at 2–3%</small><div class="grid" style="margin-top:10px"><label>Minutes<input id="tm_min" type="number" value="15"></label><label>Top incline %<input id="tm_inc" type="number" step=".5" value="10"></label><label>Speed<input id="tm_speed" type="number" step=".1" placeholder="km/h"></label><label>Completed<input id="tm_done" type="number" min="0" max="1" value="1"></label></div></div>`:`<div class="exercise"><h3>${e}</h3><div class="sets">${[1,2,3].map(n=>`<span>${n}</span><input id="w${i}_${n}" type="number" step=".5" placeholder="kg"><input id="r${i}_${n}" type="number" placeholder="reps">`).join("")}</div></div>`).join("")}
<div class="exercise"><label>How did it feel?<input id="note" placeholder="strong, tired, enjoyable..."></label></div>
<button class="primary" onclick="finish('${type}')">FINISH SESSION</button></section>`;
}
function finish(type){
let inputs={};document.querySelectorAll("input").forEach(x=>{if(x.id!=="note")inputs[x.id]=x.value});
data.sessions.push({date:new Date().toISOString(),type,inputs,note:document.getElementById("note")?.value||""});save();render("Today");
}
function progress(a){
let names=[...new Set(Object.values(plan).flat())].filter(x=>x!=="Run/walk intervals");
let html=`<section class="card"><h2>Strength progress</h2><p class="muted">Best logged working weight.</p>`;
names.forEach(e=>{let best=0;data.sessions.forEach(s=>{let idx=plan[s.type]?.indexOf(e);if(idx>=0)[1,2,3].forEach(n=>{let v=parseFloat(s.inputs?.[`w${idx}_${n}`]);if(v>best)best=v})});html+=`<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><span>${e}</span><b>${best?best+" kg":"—"}</b></div>`});
html+=`</section><section class="card"><h2>Recent sessions</h2>${data.sessions.slice(-15).reverse().map(s=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--line)"><span>${esc(s.type)}</span><small>${new Date(s.date).toLocaleDateString()}</small></div>`).join("")||"<p class='muted'>No sessions yet.</p>"}</section>`;
a.innerHTML=html;
}
function challenge(a){
let total=data.sessions.filter(s=>s.type.startsWith("Gym")||s.type.startsWith("Jog")).length;
let weeks=Math.min(12,Math.max(0,Math.floor(total/2)));
a.innerHTML=`<section class="card"><h2>12-week challenge</h2><p><b>${esc(data.challenge)}</b></p><p>Progress: ${weeks} / 12 weeks</p><progress max="12" value="${weeks}"></progress></section>
<section class="card"><h2>The rule</h2><p><b>Train → eat → recover → repeat.</b></p><p class="muted">The challenge celebrates accumulation. It doesn't punish missed days.</p></section>
<section class="card"><h2>Edit your aim</h2><label>Aim<textarea id="aim">${esc(data.aim)}</textarea></label><br><br><label>Challenge<textarea id="ch">${esc(data.challenge)}</textarea></label><br><br><button class="primary" onclick="editAim()">SAVE</button></section>`;
}
function editAim(){data.aim=document.getElementById("aim").value;data.challenge=document.getElementById("ch").value;save();render("Challenge")}
function photos(a){
a.innerHTML=`<section class="card"><h2>Weekly photo check-in 📸</h2><p>Once a week. Same place, lighting and clothes where possible. Relaxed posture.</p><input id="file" type="file" accept="image/*" multiple><div class="photo"><label>How do you feel in your body this week?<textarea id="pnote" placeholder="e.g. legs feel strong; jacket looser"></textarea></label></div><br><button class="primary" onclick="savePhoto()">SAVE CHECK-IN</button></section>
<section class="card"><h2>Check-ins</h2>${data.photos.slice().reverse().map(p=>`<div class="photo"><b>${new Date(p.date).toLocaleDateString()}</b><p>${esc(p.note)}</p>${(p.images||[]).map(i=>`<img src="${i}" style="max-width:100%;border-radius:10px;margin-top:6px">`).join("")}</div>`).join("")||"<p class='muted'>Your first check-in will appear here.</p>"}</section>`;
}
function savePhoto(){
let files=[...document.getElementById("file").files],note=document.getElementById("pnote").value;
if(!files.length){data.photos.push({date:new Date().toISOString(),note,images:[]});save();render("Photos");return}
let imgs=[],left=files.length;
files.forEach(f=>{let r=new FileReader();r.onload=()=>{imgs.push(r.result);if(--left===0){data.photos.push({date:new Date().toISOString(),note,images:imgs});save();render("Photos")}};r.readAsDataURL(f)})
}
render();
</script>
</body>
</html>
